name: Build PMUK Mac Recorder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build macOS application
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Mac installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMUK-Recorder-Mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          name: PMUK Recorder for Mac v${{ steps.app_version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            PMUK Recorder for Mac.

            Download the DMG file below, open it, and install PMUK Recorder into Applications.
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
          make_latest: true
