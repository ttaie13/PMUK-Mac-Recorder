<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PMUK Recorder</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f7f5fb;color:#20162b}.top{height:70px;background:#3E1080;color:#fff;display:flex;align-items:center;padding:0 26px;justify-content:space-between}.top b{font-size:22px}.wrap{max-width:1080px;margin:24px auto;padding:0 20px}.card{background:#fff;border:1px solid #e8e1ef;border-radius:18px;padding:22px;box-shadow:0 10px 30px #32105b12;margin-bottom:18px}.hidden{display:none!important}input{width:100%;padding:12px;border:1px solid #d9d0e3;border-radius:10px;margin:6px 0 14px;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#3E1080;color:white}.soft{background:#eee8f5;color:#3E1080}.danger{background:#b42318;color:#fff}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.lead,.recording{padding:13px;border:1px solid #eee6f4;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:14px;align-items:center}.muted{color:#756b7c;font-size:13px}.timer{font-size:58px;font-weight:800;text-align:center;margin:20px}.status{text-align:center;padding:10px}.pill{background:#eee8f5;color:#3E1080;border-radius:99px;padding:5px 9px;font-size:12px}.error{color:#b42318}.ok{color:#067647}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab.active{background:#3E1080;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e8e1ef;border-radius:15px;padding:16px}.stat strong{display:block;font-size:30px;color:#3E1080}.visual{height:90px;display:flex;align-items:center;justify-content:center;gap:5px;margin:12px 0}.bar{width:7px;height:12px;background:#3E1080;border-radius:8px;transition:height .08s}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:12px;font-weight:700}.uploaded{color:#067647}.pendingc{color:#b54708}.failed{color:#b42318}audio{width:260px;height:34px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.recording{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="top"><b>PMUK Recorder</b><span id="who"></span></div><div class="wrap">
<div id="login" class="card"><h2>Sign in</h2><p class="muted">Use your existing PMUK CRM account.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="loginBtn">Sign in</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><div class="stats"><div class="stat"><span class="muted">Calls today</span><strong id="sToday">0</strong></div><div class="stat"><span class="muted">Uploaded today</span><strong id="sUploaded">0</strong></div><div class="stat"><span class="muted">Pending</span><strong id="sPending">0</strong></div><div class="stat"><span class="muted">Failed</span><strong id="sFailed">0</strong></div></div><div class="tabs"><button class="tab active" data-tab="leadsPane">All Leads</button><button class="tab soft" data-tab="libraryPane">Recordings</button><button class="tab soft" data-tab="pendingPane">Pending Uploads</button><span class="grow"></span><button class="soft" id="logout">Sign out</button></div>
<div id="leadsPane" class="pane card"><div class="row"><input class="grow" id="search" placeholder="Search all leads by name, phone or email"><button class="soft" id="refresh">Refresh</button></div><div id="leadList"></div></div>
<div id="libraryPane" class="pane card hidden"><div class="row"><h2 class="grow">Recordings saved on this PC</h2><button class="soft" id="openRecordingFolder">Open recordings folder</button></div><input id="recordingSearch" placeholder="Search recording history by lead"><div id="recordingList"></div></div>
<div id="pendingPane" class="pane card hidden"><h2>Pending uploads</h2><div id="pendingList"></div></div></div>
<div id="rec" class="card hidden"><div class="row"><div class="grow"><h2 id="leadName"></h2><div id="leadStage" class="muted"></div></div><span class="pill">Recording locally</span></div><div class="timer" id="timer">00:00:00</div><div class="visual" id="visual"></div><div class="row"><button class="danger grow" id="stop">Stop & Save</button></div><div class="status" id="recStatus">Recording…</div></div>
</div><script src="renderer.js"></script></body></html>
